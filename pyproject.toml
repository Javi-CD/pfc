[project]
name = "pfc"
version = "0.2.0"
description = "Python File Converter"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openpyxl>=3.1.2",
    "rich>=13.0.0",
    "typer>=0.12.0",
]

[project.scripts]
pfc = "pfc.presentation.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.0.0",
    "pre-commit>=4.0.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "types-openpyxl",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
