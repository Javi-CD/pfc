[project]
name = "pfc"
version = "0.1.0"
description = "Python File Converter"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["rich>=15.0.0", "typer>=0.27.0"]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
