[project]
name = "pfc"
version = "1.0.0"
description = "Python File Converter"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Javier", email = "javierperezdeveloper@gmail.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Utilities",
]
dependencies = [
    "docx2pdf>=0.1.8",
    "filetype>=1.2.0",
    "openpyxl>=3.1.2",
    "pdf2docx>=0.5.8",
    "pillow>=12.3.0",
    "pypdf>=6.14.2",
    "python-docx>=1.1.0",
    "rich>=15.0.0",
    "typer>=0.12.0",
]

[project.entry-points."pfc.converters"]
csv_to_json = "pfc.infrastructure.converters.csv_converter:CsvToJsonConverter"
json_to_csv = "pfc.infrastructure.converters.json_converter:JsonToCsvConverter"
csv_to_xlsx = "pfc.infrastructure.converters.xlsx_converter:CsvToXlsxConverter"
xlsx_to_csv = "pfc.infrastructure.converters.xlsx_converter:XlsxToCsvConverter"
image_converter = "pfc.infrastructure.converters.image_converter:ImageConverter"
pdf_to_txt = "pfc.infrastructure.converters.pdf_converter:PdfToTxtConverter"
pdf_to_docx = "pfc.infrastructure.converters.pdf_converter:PdfToDocxConverter"
docx_to_txt = "pfc.infrastructure.converters.docx_converter:DocxToTxtConverter"
txt_to_docx = "pfc.infrastructure.converters.docx_converter:TxtToDocxConverter"
docx_to_pdf = "pfc.infrastructure.converters.docx_converter:DocxToPdfConverter"

[project.scripts]
pfc = "pfc.presentation.cli:app"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pre-commit>=4.0.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
    "types-openpyxl",
    "pyinstaller>=6.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff.lint]
ignore = ["B008", "BLE001", "PERF402", "RUF012", "UP035", "UP006", "UP045", "PIE790", "I001"]
