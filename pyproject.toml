[project]
name = "pfc"
version = "0.3.0"
description = "Python File Converter"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "docx2pdf>=0.1.8",
    "openpyxl>=3.1.2",
    "pdf2docx>=0.5.8",
    "pillow>=12.3.0",
    "pypdf>=6.14.2",
    "python-docx>=1.1.0",
    "rich>=15.0.0",
    "typer>=0.12.0",
]

[project.scripts]
pfc = "pfc.presentation.cli:app"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pre-commit>=4.0.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.22",
    "types-openpyxl",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
